services:
  graphhopper:
    # Built from this repo so config.yml travels inside the image. Pinning lives
    # in Dockerfile.graphhopper, which fixes the base to the 11.0 digest that
    # built graph-cache; a different GraphHopper release can reject the cache
    # and fall back to importing a .pbf that is deliberately not on the server.
    build:
      context: .
      dockerfile: Dockerfile.graphhopper
    command: --host 0.0.0.0
    volumes:
      # Coolify rewrites every bind mount source to its own managed directory,
      # /data/coolify/applications/<uuid>/graph-cache, whatever this says - an
      # absolute path and a GRAPH_CACHE_PATH variable were both ignored. So the
      # cache has to be placed in that directory on the server; this relative
      # path is what works locally and is what Coolify maps.
      #
      # Container path must be /data/default-gh: the image overrides
      # graph.location, so the graph-cache value in config.yml is ignored and
      # mounting anywhere else makes GraphHopper re-import.
      - ./graph-cache:/data/default-gh
    environment:
      - JAVA_OPTS=-Xmx2g
      - TZ=Europe/Amsterdam
    # expose, not ports: reachable from caddy over the compose network only.
    expose:
      - "8989"
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    depends_on:
      - graphhopper
    environment:
      # Set in Coolify's environment for this stack. Never commit the value.
      - API_TOKEN=${GRAPHHOPPER_TOKEN}
    ports:
      - "8080"
    restart: unless-stopped
