services:
  graphhopper:
    # Pinned to the version that built graph-cache: logs/graphhopper.log records
    # "version 11.0|2025-10-14T14:28:00Z" for the 2026-07-28 import. A different
    # GraphHopper release can reject the cache and fall back to importing
    # datareader.file - a .pbf deliberately not on this host - and crash-loop.
    #
    # The digest makes this immutable; a tag alone can be re-pushed (upstream
    # moved :latest on 2026-06-18). Drop the @sha256 part if you would rather
    # take rebuilds of 11.0, e.g. for base-image security updates.
    image: israelhikingmap/graphhopper:11.0@sha256:e77e14e48ea69ea7bb0eb71ddc9d583e5ce85dd295475572371f72ed4880a1ff
    command: --host 0.0.0.0
    volumes:
      # Prebuilt cache. The container path must be /data/default-gh: this image
      # overrides graph.location, so the graph-cache setting in config.yml is
      # ignored and mounting anywhere else makes GraphHopper decide the graph is
      # missing and re-import.
      #
      # Locally the source is ./graph-cache; on the server set
      # GRAPH_CACHE_PATH=/data/benedrone/graph-cache, where it was rsynced once.
      # No .pbf mount: with a valid cache the import never runs. Verified against
      # this exact digest - it loads the cache and routes with no .pbf present.
      - ${GRAPH_CACHE_PATH:-./graph-cache}:/data/default-gh
      # Coolify rewrites RELATIVE bind mounts into its own managed storage
      # directory rather than the repo clone, so ./config.yml resolves to a path
      # that does not exist, Docker creates it as a directory, and the container
      # fails with "Are you trying to mount a directory onto a file". Absolute
      # paths pass through untouched - set GH_CONFIG_PATH on the server.
      - ${GH_CONFIG_PATH:-./config.yml}:/graphhopper/config-example.yml:ro
      # A directory is the correct type here, so the same rewrite is harmless.
      - ./logs:/graphhopper/logs
    environment:
      - JAVA_OPTS=-Xmx2g
      - TZ=Europe/Amsterdam
    # expose, not ports: reachable from caddy over the compose network only.
    expose:
      - "8989"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - graphhopper
    volumes:
      # Absolute for the same reason as GH_CONFIG_PATH above.
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
    environment:
      # Set in Coolify's environment for this stack. Never commit the value.
      - API_TOKEN=${GRAPHHOPPER_TOKEN}
    ports:
      - "8080"
    restart: unless-stopped
