services:
  graphhopper:
    # Built from this repo so config.yml travels inside the image. Pinning lives
    # in Dockerfile.graphhopper, which fixes the base to the 11.0 digest that
    # built graph-cache; a different GraphHopper release can reject the cache
    # and fall back to importing a .pbf that is deliberately not on the server.
    build:
      context: .
      dockerfile: Dockerfile.graphhopper
    command: --host 0.0.0.0
    volumes:
      # Coolify rewrites every bind mount source to its own managed directory,
      # /data/coolify/applications/<uuid>/graph-cache, whatever this says - an
      # absolute path and a GRAPH_CACHE_PATH variable were both ignored. So the
      # cache has to be placed in that directory on the server; this relative
      # path is what works locally and is what Coolify maps.
      #
      # Container path must be /data/default-gh: the image overrides
      # graph.location, so the graph-cache value in config.yml is ignored and
      # mounting anywhere else makes GraphHopper re-import.
      - ./graph-cache:/data/default-gh
    environment:
      - JAVA_OPTS=-Xmx2g
      - TZ=Europe/Amsterdam
    # No ports and no expose. Containers on the same compose network reach
    # each other on any port regardless, so caddy still proxies to 8989 - but
    # Coolify treats a service with declared ports as web-facing and generates
    # a domain for it, which Traefik then routes straight here, bypassing the
    # token gate entirely. Declaring nothing keeps this container private.
    # GraphHopper's own HealthCheckResource. start_period is generous because
    # the first request has to memory-map a 4.8 GB graph off disk; until it
    # elapses, failures do not count against retries.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8989/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    depends_on:
      - graphhopper
    environment:
      # Set in Coolify's environment for this stack. Never commit the value.
      - API_TOKEN=${GRAPHHOPPER_TOKEN}
    ports:
      - "8080"
    # /health is the one route the Caddyfile leaves unauthenticated, and it
    # proxies through to GraphHopper - so a healthy gate means the whole chain
    # works, not just that Caddy is listening.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
